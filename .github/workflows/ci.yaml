name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: lint, test, vuln
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make lint
      - run: make test
      - run: make vuln
      - run: make build

  manifests:
    name: manifests, collector configs, generated files
    runs-on: ubuntu-latest
    env:
      KUSTOMIZE_VERSION: v5.8.3
      KUBECONFORM_VERSION: v0.8.0
      OTELCOL_VERSION: 0.162.0
      PROMETHEUS_VERSION: v3.15.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install kustomize + kubeconform
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | sudo tar xz -C /usr/local/bin kustomize
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | sudo tar xz -C /usr/local/bin kubeconform
      - name: Render + validate every overlay
        run: make manifests
      - name: Generated rules/dashboard are up to date
        run: make verify-generated
      - name: promtool check rules + config
        run: |
          docker run --rm -v "$PWD/deploy/base/prometheus:/p" --entrypoint promtool prom/prometheus:${PROMETHEUS_VERSION} check rules /p/slo-rules.yaml
          docker run --rm -v "$PWD/deploy/base/prometheus:/etc/prometheus" --entrypoint promtool prom/prometheus:${PROMETHEUS_VERSION} check config --syntax-only /etc/prometheus/prometheus.yml
      - name: otelcol validate (gateway: base + gke overlay)
        run: |
          for extra in deploy/base/otel/cloud-gateway.yaml deploy/overlays/gke/cloud-gateway.yaml; do
            docker run --rm -v "$PWD:/w" -e MY_POD_IP=127.0.0.1 -e CLUSTER_NAME=ci -e DEPLOYMENT_ENVIRONMENT=ci -e TRACES_OTLP_ENDPOINT=localhost:4317 \
              otel/opentelemetry-collector-contrib:${OTELCOL_VERSION} validate --config=/w/deploy/base/otel/gateway.yaml --config=/w/$extra
          done

  e2e-minikube:
    name: e2e on minikube
    needs: [go, manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: medyagh/setup-minikube@v0.0.21
        with:
          cpus: max
          memory: max
          driver: docker
      - name: Build image and load into minikube
        run: make image VERSION=${GITHUB_SHA::7}
      - name: Deploy
        run: make deploy OVERLAY=minikube
      - name: Wait for rollout
        run: make wait
      - name: End-to-end assertions
        run: make e2e
      - name: Diagnostics
        if: always()
        run: |
          mkdir -p .e2e
          kubectl get pods -A -o wide > .e2e/pods.txt || true
          kubectl get events -A --sort-by=.lastTimestamp > .e2e/events.txt || true
          for d in otel-gateway slo-engine prometheus jaeger; do kubectl -n observability logs deploy/$d --tail=300 > .e2e/$d.log 2>&1 || true; done
          kubectl -n observability logs ds/otel-agent --tail=300 > .e2e/otel-agent.log 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-artifacts
          path: .e2e/
