# OpenTelemetry Collector - AGENT (DaemonSet, one per node)
# Responsibilities: receive OTLP from pods on the same node, collect
# container/pod/node resource metrics from the kubelet, enrich everything with
# Kubernetes metadata, then forward to the gateway.
# Cloud-specific settings live in cloud.yaml (merged on top of this file).
extensions:
  health_check:
    endpoint: ${env:MY_POD_IP}:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  kubelet_stats:
    collection_interval: 20s
    auth_type: serviceAccount
    endpoint: https://${env:K8S_NODE_IP}:10250
    # Kubelet serving certs are self-signed on minikube/EKS/AKS/GKE by default.
    insecure_skip_verify: true
    metric_groups: [container, pod, node]
    metrics:
      k8s.container.cpu_limit_utilization:
        enabled: true
      k8s.container.cpu_request_utilization:
        enabled: true
      k8s.container.memory_limit_utilization:
        enabled: true
      k8s.container.memory_request_utilization:
        enabled: true
      k8s.pod.cpu_limit_utilization:
        enabled: true
      k8s.pod.memory_limit_utilization:
        enabled: true

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  k8s_attributes:
    auth_type: serviceAccount
    passthrough: false
    filter:
      node_from_env_var: K8S_NODE_NAME
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.deployment.name
        - k8s.node.name
        - container.image.name
        - container.image.tag
      labels:
        - tag_name: app.kubernetes.io/name
          key: app.kubernetes.io/name
          from: pod
        - tag_name: app.kubernetes.io/version
          key: app.kubernetes.io/version
          from: pod
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.uid
      - sources:
          - from: resource_attribute
            name: k8s.pod.ip
      - sources:
          - from: connection
  resource_detection:
    detectors: [env, system]
    timeout: 5s
    override: false
  batch:
    send_batch_size: 1024
    timeout: 5s

exporters:
  otlp_grpc/gateway:
    endpoint: otel-gateway.observability.svc.cluster.local:4317
    tls:
      insecure: true
    sending_queue:
      enabled: true
      queue_size: 5000
    retry_on_failure:
      enabled: true

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: normal
      # Collector self-monitoring (queue size, refused/dropped data points).
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, k8s_attributes, resource_detection, batch]
      exporters: [otlp_grpc/gateway]
    metrics:
      receivers: [otlp, kubelet_stats]
      processors: [memory_limiter, k8s_attributes, resource_detection, batch]
      exporters: [otlp_grpc/gateway]
