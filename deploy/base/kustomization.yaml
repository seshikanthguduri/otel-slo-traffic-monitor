apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Cloud-neutral base. Use an overlay: deploy/overlays/{minikube,eks,gke,aks}.
labels:
  - pairs:
      app.kubernetes.io/part-of: otel-slo-traffic-monitor
    includeSelectors: false
resources:
  - namespaces.yaml
  - otel-agent.yaml
  - otel-gateway.yaml
  - jaeger.yaml
  - prometheus/prometheus.yaml
  - grafana/grafana.yaml
  - slo-engine/slo-engine.yaml
  - demo-apps.yaml
configMapGenerator:
  - name: otel-agent-config
    namespace: observability
    files:
      - agent.yaml=otel/agent.yaml
      - cloud.yaml=otel/cloud-agent.yaml
  - name: otel-gateway-config
    namespace: observability
    files:
      - gateway.yaml=otel/gateway.yaml
      - cloud.yaml=otel/cloud-gateway.yaml
  - name: prometheus-config
    namespace: observability
    files:
      - prometheus/prometheus.yml
      - prometheus/slo-rules.yaml
  - name: slo-engine-config
    namespace: observability
    files:
      - slo-engine/slo-config.yaml
  - name: grafana-datasources
    namespace: observability
    files:
      - grafana/datasources.yaml
  - name: grafana-dashboards-provider
    namespace: observability
    files:
      - grafana/dashboards-provider.yaml
  - name: grafana-dashboards
    namespace: observability
    files:
      - grafana/dashboards/slo-overview.json
