# Demo microservice topology: one image, role selected by SERVICE_NAME and DOWNSTREAMS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: demo
  labels: &id001
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: demo-shop
    app.kubernetes.io/version: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 15
      containers:
      - name: app
        image: otel-slo-traffic-monitor:latest
        imagePullPolicy: IfNotPresent
        command:
        - /usr/local/bin/demo-service
        env:
        - name: OTEL_SERVICE_NAME
          value: frontend
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-agent.observability.svc.cluster.local:4317
        - name: OTEL_EXPORTER_OTLP_INSECURE
          value: 'true'
        - name: OTEL_METRIC_EXPORT_INTERVAL
          value: '15000'
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.uid=$(POD_UID),k8s.container.name=app,service.namespace=demo
        - name: SERVICE_NAME
          value: frontend
        - name: DOWNSTREAMS
          value: http://catalog:8080/api/work,http://checkout:8080/api/work
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 96Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: demo
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
