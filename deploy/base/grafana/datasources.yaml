apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus.observability.svc.cluster.local:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger.observability.svc.cluster.local:16686
