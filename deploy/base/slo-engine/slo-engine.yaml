apiVersion: v1
kind: ServiceAccount
metadata:
  name: slo-engine
  namespace: observability
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slo-engine
  namespace: observability
  labels:
    app.kubernetes.io/name: slo-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: slo-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slo-engine
    spec:
      serviceAccountName: slo-engine
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: slo-engine
          image: otel-slo-traffic-monitor:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/slo-engine"]
          args: ["serve", "-config", "/etc/slo/slo-config.yaml", "-listen", ":8081"]
          env:
            - name: PROMETHEUS_URL
              value: http://prometheus.observability.svc.cluster.local:9090
            - name: OTEL_SERVICE_NAME
              value: slo-engine
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-agent.observability.svc.cluster.local:4317
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "15000"
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.uid=$(POD_UID),k8s.container.name=slo-engine,service.namespace=observability
          ports:
            - {name: http, containerPort: 8081}
          readinessProbe:
            httpGet: {path: /readyz, port: 8081}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 8081}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/slo}
      volumes:
        - name: config
          configMap:
            name: slo-engine-config
---
apiVersion: v1
kind: Service
metadata:
  name: slo-engine
  namespace: observability
spec:
  selector:
    app.kubernetes.io/name: slo-engine
  ports:
    - {name: http, port: 8081, targetPort: 8081}
