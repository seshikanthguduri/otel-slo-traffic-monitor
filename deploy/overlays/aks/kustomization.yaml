apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Azure Kubernetes Service with the Azure Monitor metrics add-on enabled
# (az aks update --enable-azure-monitor-metrics ...). Replace REPLACE_ME values.
resources:
  - ../../base
  - ama-metrics-prometheus-config.yaml
images:
  - name: otel-slo-traffic-monitor
    newName: REPLACE_ME.azurecr.io/otel-slo-traffic-monitor
    newTag: v0.1.0
configMapGenerator:
  - name: otel-agent-config
    namespace: observability
    behavior: merge
    files:
      - cloud.yaml=cloud-agent.yaml
patches:
  - target: {kind: Deployment, name: otel-gateway}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: REPLACE_ME-aks-cluster
