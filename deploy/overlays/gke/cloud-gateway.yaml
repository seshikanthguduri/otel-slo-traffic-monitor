# GKE: also export to Google Cloud Managed Service for Prometheus using
# Workload Identity (roles/monitoring.metricWriter on the bound GSA).
processors:
  resource_detection/gcp:
    detectors: [env, gcp]
    timeout: 5s
exporters:
  googlemanagedprometheus:
    metric:
      resource_filters:
        - regex: "k8s.*|service.*|deployment.*"
service:
  pipelines:
    metrics:
      processors: [memory_limiter, resource/cluster, resource_detection/gcp, batch]
      exporters: [prometheus, googlemanagedprometheus]
